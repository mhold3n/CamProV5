[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campro"
version = "5.0.0"
description = "CamPro V5 Python components"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "CamPro Development Team", email = "dev@campro.example.com" },
]
license = { text = "MIT" }
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy>=1.20.0",
  "matplotlib>=3.4.0",
  "scipy>=1.6.0",
  "pandas>=1.2.0",
  "PyQt5>=5.15.0",
  "PyQtChart>=5.15.0",
  "tqdm>=4.60.0",
  "colorama>=0.4.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=6.2.0",
  "pytest-qt>=4.0.0",
]

[project.scripts]
campro = "campro.main:main"
campro-test-setup = "campro.testing.setup_agent:main"
campro-test-scenarios = "campro.testing.create_scenarios:main"
campro-test-session = "campro.testing.start_agent_session:main"

[tool.setuptools]
# If you move to a src/ layout later, adjust the package discovery below.

[tool.setuptools.packages.find]
where = ["."]
include = ["campro*"]
exclude = ["tests*", "docs*"]
