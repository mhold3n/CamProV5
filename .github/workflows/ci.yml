name: CI

on:
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '.junie/**'
      - 'docs/**'
      - '**/*.md'
  merge_group: {}
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      # - 'chore/**'       # optional
      # - 'experiment/**' # optional
    paths-ignore:
      - '.junie/**'
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jvm-desktop:
    name: CI / jvm-desktop
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - run: ./gradlew test --stacktrace
      - run: ./gradlew :desktop:ktlintCheck

  rust-fea-engine:
    name: CI / rust-fea-engine
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: camprofw/rust/fea-engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            camprofw/rust/fea-engine/target
          key: cargo-${{ runner.os }}-${{ hashFiles('camprofw/rust/fea-engine/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - run: cargo build --locked --all-targets
      - run: cargo test  --locked --all
      - run: cargo clippy -- -D warnings
