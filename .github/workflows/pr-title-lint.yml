name: PR Title Lint

on:
  pull_request:
    types: [ opened, edited, synchronize, reopened ]
  merge_group: {}

permissions:
  pull-requests: read

jobs:
  lint:
    name: PR Title Lint
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
          requireScope: false
