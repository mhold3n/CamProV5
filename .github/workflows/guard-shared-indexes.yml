name: Guard Shared Indexes

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_call:

jobs:
  guard:
    name: Prevent tracking shared-indexes directories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run guard script
        run: bash scripts/ci/check-shared-indexes.sh
