name: Guard Shared Indexes
on:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'shared-index/**'
      - 'scripts/shared-index/**'
      - 'scripts/ci/**'
  push:
    branches: [ main, master ]
    paths:
      - 'shared-index/**'
      - 'scripts/shared-index/**'
      - 'scripts/ci/**'
  workflow_dispatch:

permissions: { contents: read }

jobs:
  guard:
    name: Guard Shared Indexes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/ci/check-shared-indexes.sh
