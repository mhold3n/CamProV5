name: Mirror GitHub Issues → Repo Files
on:
  issues:
    types: [opened, edited, labeled, unlabeled, assigned, unassigned, reopened, closed]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: issue-sync-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: read

jobs:
  downsync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Ensure bot branch exists and checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if git ls-remote --exit-code --heads origin bot/issue-sync >/dev/null 2>&1; then
            git fetch origin bot/issue-sync:bot/issue-sync
            git switch bot/issue-sync
          else
            git switch -c bot/issue-sync
            git push -u origin bot/issue-sync
          fi

      - name: Mirror issues/comments to .junie
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sudo apt-get update -y && sudo apt-get install -y jq gh
          mkdir -p .junie/issues .junie/comments .junie/issues/aliases

          write_issue() {
            local num="$1"
            issue_json=$(gh api repos/$REPO/issues/$num)
            title=$(jq -r '.title' <<<"$issue_json")
            state=$(jq -r '.state' <<<"$issue_json")
            body=$(jq -r '.body // ""' <<<"$issue_json")
            labels=$(jq -r '[.labels[].name]' <<<"$issue_json")
            assignees=$(jq -r '[.assignees[].login]' <<<"$issue_json")
            milestone=$(jq -r '.milestone.title // empty' <<<"$issue_json")
            created=$(jq -r '.created_at' <<<"$issue_json")
            updated=$(jq -r '.updated_at' <<<"$issue_json")
            url=$(jq -r '.html_url' <<<"$issue_json")
            etag=$(gh api -i repos/$REPO/issues/$num | awk 'BEGIN{IGNORECASE=1} /^etag:/{print $2; exit}')

            file=".junie/issues/${num}.md"
            {
              echo '---'
              echo "issue: $num"
              echo "repo: $REPO"
              echo "state: $state"
              printf 'title: "%s"\n' "$title"
              echo "labels: $labels"
              echo "assignees: $assignees"
              [ -n "$milestone" ] && echo "milestone: $milestone"
              echo "created_at: $created"
              echo "updated_at: $updated"
              [ -n "$etag" ] && echo "etag: $etag"
              echo "url: $url"
              echo '---'
              echo
              printf '%s\n' "$body"
            } > "$file"

            slug=$(echo "$title" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-|-$//g')
            printf 'See ../%s.md\n' "$num" > ".junie/issues/aliases/${num}-${slug}.md"

            mkdir -p ".junie/comments/$num"
            gh api repos/$REPO/issues/$num/comments --paginate | jq -c '.[]' | while read -r c; do
              ccreated=$(jq -r '.created_at' <<<"$c")
              cauthor=$(jq -r '.user.login' <<<"$c")
              cbody=$(jq -r '.body // ""' <<<"$c")
              cid=$(jq -r '.id' <<<"$c")
              fname=".junie/comments/$num/${ccreated}_${cauthor}_${cid}.md"
              {
                echo '---'
                echo "author: $cauthor"
                echo "created_at: $ccreated"
                echo "id: $cid"
                echo '---'
                echo
                printf '%s\n' "$cbody"
              } > "$fname"
            done
          }

          # Handle different event types
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Only sync last 25 updated issues in scheduled runs
            echo "Scheduled run: syncing last 25 updated issues"
            list=$(gh api repos/$REPO/issues -f state=all -f per_page=25 -f sort=updated)
            count=$(jq 'length' <<<"$list")
            if [ "$count" -gt 0 ]; then
              jq -r '.[].number' <<<"$list" | while read num; do write_issue "$num"; done
            else
              echo "No issues found to sync"
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual dispatch: sync last 10 updated issues
            echo "Manual dispatch: syncing last 10 updated issues"
            list=$(gh api repos/$REPO/issues -f state=all -f per_page=10 -f sort=updated)
            count=$(jq 'length' <<<"$list")
            if [ "$count" -gt 0 ]; then
              jq -r '.[].number' <<<"$list" | while read num; do write_issue "$num"; done
            else
              echo "No issues found to sync"
            fi
          else
            # Event-driven: sync specific issue
            if [ -n "${{ github.event.issue.number }}" ]; then
              echo "Issue event: syncing issue #${{ github.event.issue.number }}"
              write_issue "${{ github.event.issue.number }}"
            elif [ -n "${{ github.event.comment.issue_url }}" ]; then
              num=${{ github.event.comment.issue_url }}
              num=${num##*/}
              echo "Comment event: syncing issue #$num"
              write_issue "$num"
            else
              echo "No specific issue to sync for event type: ${{ github.event_name }}"
            fi
          fi

      - name: Commit with retry on conflict
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          
          # Check if there are changes to commit
          if [[ -z "$(git status --porcelain .junie/)" ]]; then
            echo "No changes to commit"
            exit 0
          fi
          
          # Add changes
          git add .junie/issues/** .junie/comments/** || true
          
          # Commit with retry logic
          for i in {1..3}; do
            if git commit -m "chore(junie): sync issues → files [junie-mirror]" && \
               git pull --rebase origin bot/issue-sync && \
               git push --force-with-lease origin bot/issue-sync; then
              echo "Successfully committed and pushed (attempt $i)"
              break
            elif [ $i -eq 3 ]; then
              echo "Failed to push after 3 attempts"
              exit 1
            else
              echo "Conflict detected, retrying... (attempt $i/3)"
              sleep $((RANDOM % 10 + 5))  # Random delay 5-15 seconds
            fi
          done
