name: Shared Indexes Smoke
on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.junie/config/**'
      - '.github/workflows/shared-indexes-smoke.yml'
  workflow_dispatch:

jobs:
  smoke-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y zip gpg curl
      - name: Run smoke (Bash on Linux)
        run: |
          bash scripts/ci/smoke-shared-indexes.sh
  smoke-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke (PowerShell on Windows)
        shell: pwsh
        run: |
          pwsh -File scripts/ci/smoke-shared-indexes.ps1
