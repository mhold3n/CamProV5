name: Desktop Unit Tests (Headless)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-desktop:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run desktop tests headlessly
        env:
          # Force headless AWT/Swing for JVM
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
          # Compose headless (no need for GL)
          COMPOSE_DESKTOP_LINUX_SWING_GLOBAL_MENU: false
        run: ./gradlew :desktop:test --no-daemon --stacktrace

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-reports
          path: desktop/build/reports/tests/test


