name: Python CI

on:
  # Disabled from automatic runs; keep for manual use only
  workflow_dispatch:

jobs:
  test:
    name: Python Tests (manual only)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        if: hashFiles('requirements.txt') != ''
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Install project (if setup.py exists)
        if: hashFiles('setup.py') != ''
        run: python -m pip install -e .

      - name: Install additional test dependencies
        run: |
          python -m pip install pytest

      - name: Install Rust (if Rust components exist)
        if: hashFiles('Cargo.toml') != '' || hashFiles('camprofw/rust/**') != ''
        uses: dtolnay/rust-toolchain@stable

      - name: Run pytest (if tests present)
        if: hashFiles('tests/**') != ''
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          pytest -v tests --tb=short
