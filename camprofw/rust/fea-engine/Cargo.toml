[[bench]]
name = "motion_law_benchmarks"
harness = false

[[bin]]
name = "parameter_validation"
path = "tests/parameter_validation.rs"

[[bin]]
name = "parameter_validation"
path = "tests/parameter_validation.rs"

[package]
name = "fea-engine"
version = "0.9.0-beta"
edition = "2021"
authors = [ "CamPro Team",]
description = "High-performance FEA engine for cam profile simulation"

[dependencies]
rayon = "1.7"
serde_json = "1.0"
toml = "0.7"
nalgebra = "0.32"
nalgebra-sparse = "0.9"
thiserror = "2.0"
anyhow = "1.0"
chrono = "0.4.26"
jni = "0.21"
lazy_static = "1.4"

[dev-dependencies]
approx = "0.5"
criterion = "0.5"

[lib]
name = "fea_engine"
path = "src/lib.rs"
crate-type = [ "cdylib", "rlib",]

[dependencies.serde]
version = "1.0"
features = [ "derive",]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
